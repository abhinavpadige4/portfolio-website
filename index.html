<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>
<body class="bg-background text-text font-base">
    <header class="hero-section bg-primary text-white py-16 text-center">
        <h1 class="hero-title text-4xl font-heading mb-4">Welcome to My Portfolio</h1>
        <p class="hero-description text-lg">Explore my projects, skills, and get in touch.</p>
        <nav aria-label="Main Navigation">
            <ul class="flex justify-center mt-8">
                <li><a href="#projects" class="nav-link px-4 py-2 rounded hover:bg-muted">Projects</a></li>
                <li><a href="#skills" class="nav-link px-4 py-2 rounded hover:bg-muted">Skills</a></li>
                <li><a href="#contact" class="nav-link px-4 py-2 rounded hover:bg-muted">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="projects" class="projects-section py-16">
            <h2 class="section-title text-3xl font-heading mb-8">Projects</h2>
            <div class="projects-grid grid grid-cols-1 md:grid-cols-2 gap-8">
                <article class="project-card p-8 bg-white shadow-md rounded">
                    <h3 class="project-title text-xl font-heading mb-4">Project One</h3>
                    <p class="project-description">Description of project one.</p>
                </article>
                <article class="project-card p-8 bg-white shadow-md rounded">
                    <h3 class="project-title text-xl font-heading mb-4">Project Two</h3>
                    <p class="project-description">Description of project two.</p>
                </article>
            </div>
        </section>
        <section id="skills" class="skills-section py-16">
            <h2 class="section-title text-3xl font-heading mb-8">Skills</h2>
            <ul class="skills-list flex flex-wrap gap-4">
                <li class="skill-item bg-white shadow-md rounded p-4">HTML</li>
                <li class="skill-item bg-white shadow-md rounded p-4">CSS</li>
                <li class="skill-item bg-white shadow-md rounded p-4">JavaScript</li>
                <li class="skill-item bg-white shadow-md rounded p-4">Tailwind CSS</li>
            </ul>
        </section>
        <section id="contact" class="contact-section py-16">
            <h2 class="section-title text-3xl font-heading mb-8">Contact</h2>
            <form id="contact-form" class="contact-form flex flex-col gap-4">
                <label for="name" class="sr-only">Name</label>
                <input type="text" id="name" name="name" placeholder="Your Name" class="contact-input p-4 border rounded" required>
                <label for="email" class="sr-only">Email</label>
                <input type="email" id="email" name="email" placeholder="Your Email" class="contact-input p-4 border rounded" required>
                <label for="message" class="sr-only">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Your Message" class="contact-input p-4 border rounded" required></textarea>
                <button type="submit" class="contact-button bg-primary text-white p-4 rounded hover:bg-muted">Send Message</button>
            </form>
        </section>
    </main>
    <script src="./script.js" type="module"></script>
</body>
</html>
